name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: 离线测试（Python 3.13）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 语法检查（编译全部源码）
        run: python -m compileall -q app scripts tests

      - name: 运行离线测试（假 LLM + 假发送器，无网络、无真实凭据）
        run: python -m unittest discover -s tests -t . -v

      - name: 确认仓库内没有凭据与运行数据
        run: |
          set -eu
          bad=$(git ls-files | grep -E '(^|/)\.env$|^storage/|\.db(-wal|-shm)?$|^deploy/stickers/assets/' || true)
          if [ -n "$bad" ]; then echo "以下路径不应入库："; echo "$bad"; exit 1; fi
          echo "ok"
